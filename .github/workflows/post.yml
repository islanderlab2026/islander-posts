name: post-reel
on:
  schedule:
    # GitHub 排程常延遲或跳過：每個時段觸發 3 次，第一次發完片就搬走，後面兩次找不到片自動結束
    - cron: "47 12 * * *"   # 20:47 台灣（第 1 支）
    - cron: "17 13 * * *"   # 21:17 補跑
    - cron: "47 13 * * *"   # 21:47 補跑
    - cron: "47 3 * * 6,0"  # 週末 11:47（第 2 支）
    - cron: "17 4 * * 6,0"  # 12:17 補跑
    - cron: "47 4 * * 6,0"  # 12:47 補跑
    # 2026-11 時段測試：平日中午與傍晚也觸發，當天要不要發由 queue/times.json 決定（沒寫的日子＝21 點）
    - cron: "47 3 * * 1-5"   # 平日 11:47
    - cron: "17 4 * * 1-5"   # 12:17 補跑
    - cron: "47 4 * * 1-5"   # 12:47 補跑
    - cron: "47 9 * * 1-5"   # 平日 17:47
    - cron: "17 10 * * 1-5"  # 18:17 補跑
    - cron: "47 10 * * 1-5"  # 18:47 補跑
  workflow_dispatch:
    inputs:
      date:
        description: "要發哪天的片（YYYY-MM-DD，空白＝今天）"
        required: false
      slot:
        description: "第幾支（1＝晚上那支，2＝週末中午那支）"
        required: false
        default: "1"
      account:
        description: "哪個帳號（main＝島民 islanderlab2026，fur＝furfriend.tw）"
        required: false
        default: "main"
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    environment: ig-post
    env:
      HAS_FUR: ${{ secrets.IG_TOKEN_FUR != '' }}
      SLOT_NOW: ${{ contains(github.event.schedule, '6,0') && '2' || inputs.slot || '1' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 用最新的 main，避免前一次剛搬走的片又被發
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Post today's reel
        if: inputs.account != 'fur'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ inputs.date }}
          SLOT: ${{ env.SLOT_NOW }}
          PAGES_BASE: https://islanderlab2026.github.io/islander-posts
        run: python scripts/post.py
      - name: Post furfriend.tw reel
        # 跟島民同樣時段：平日晚上 1 支、週末中午＋晚上；檔名 queue/fur/<日期>[-2].mp4
        if: always() && env.HAS_FUR == 'true' && (inputs.account == 'fur' || github.event_name == 'schedule')
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_FUR }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_FUR }}
          POST_DATE: ${{ inputs.date }}
          SLOT: ${{ env.SLOT_NOW }}
          QDIR: queue/fur
          DONE: posted/fur
          PAGES_BASE: https://islanderlab2026.github.io/islander-posts
        run: python scripts/post.py
      - name: IG 數據收集（島民）
        # 2026-11-02：發後 48 小時／7 天快照＋每天帳號數字，失敗不影響發片
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DONE: posted
          ACC: main
        run: python scripts/metrics.py
      - name: IG 數據收集（furfriend）
        if: always() && env.HAS_FUR == 'true'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_FUR }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_FUR }}
          DONE: posted/fur
          ACC: fur
        run: python scripts/metrics.py
      - name: 每日分析（analysis/latest.json）
        # 2026-11-02 王大人選 A：數字由程式算，週一研究只讀這份
        if: always()
        continue-on-error: true
        run: python scripts/analyze.py
      - name: Move to posted/ and commit
        if: always()
        run: |
          git config user.name "islander-bot"
          git config user.email "islander-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "posted $(date -u +%F)"
          git pull --rebase origin main && git push
