name: post-reel
on:
  schedule:
    - cron: "0 13 * * *"   # 21:00 台灣時間
  workflow_dispatch:
    inputs:
      date:
        description: "要發哪天的片（YYYY-MM-DD，空白＝今天）"
        required: false
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    environment: ig-post        # 在 Settings > Environments 設「需要核准」= 半自動
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Post today's reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ inputs.date }}
          PAGES_BASE: https://islanderlab2026.github.io/islander-posts
        run: python scripts/post.py
      - name: Move to posted/ and commit
        run: |
          git config user.name "islander-bot"
          git config user.email "islander-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "posted $(date -u +%F)" && git push
