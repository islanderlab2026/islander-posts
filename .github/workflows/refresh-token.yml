name: refresh-token
on:
  schedule:
    - cron: "17 2 1,15 * *"   # 每月 1、15 號延長權杖
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh long-lived IG token
        env: { IG_TOKEN: "${{ secrets.IG_TOKEN }}" }
        run: |
          r=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          echo "$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print('expires_in(days)=',round(d.get('expires_in',0)/86400,1)) if 'expires_in' in d else (print(d),sys.exit(1))"
